<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUIT NINJA KA BHAI FRUIT GANJA</title>
    <link rel="stylesheet" href="css.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Give+You+Glory&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. Start / Main Menu Screen -->
    <div id="startScreen" class="screen  "> 
        <h1>WELCOME TO BANKAI FRUIT</h1>
        <p>Cut fruits! Avoid bombs!!!</p>
        <p>YOU HAVE ONLY ONE LIFE !!!</p>
        <button id="startButton">LETSS GOO!!!!</button>
    </div>

    <!-- 2. Main Gameplay Screen -->
     <!-- eksath do class assign kr rhe  -->
    <div id="gameplayScreen" class="screen hidden ">
        <!-- Live HUD elements sit here -->
        <div id="hud">
            <span>SCORE: </span><strong id="score">0</strong>
        </div>
        
        <!-- The Main Gameplay Canvas -->
        <canvas id="game"></canvas>
    </div>

    <!-- 3. Game Over Screen Overlay -->
    <div id="gameOverScreen" class="screen hidden">
        <h1>GAME OVER</h1>
        <p>Your Score</p>
        <h2 id="finalScore">0</h2>
        <p>🏆 Best Score: <span id="highScore">0</span></p>
        <button id="restartButton">PLAY AGAIN</button>
    </div>

   <script src="script.js"></script>

</body>
</html>
